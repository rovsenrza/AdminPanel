<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/admin/admin-assets/css/login.css">
</head>

<body class="login-body">
    <div class="login-page">
        <div class="container">
            <div class="login-page__inner">
                <a href="https://jeywastudio.com/">
                    <img src="/admin/admin-assets/img/black-logo.webp" alt="Logo Jeywa">
                </a>
                <div>
                    <h4 class="mb-1">Добро пожаловать в Jeywa! 👋</h4>
                    <p class="mb-6">Пожалуйста, войдите в свою учетную запись и начните редактирование.</p>
                </div>
                <form action="/backend/auth/login" method="POST" id="loginForm">
                    <div class="item">
                        <label for="">Введите адрес электронной почты </label>
                        <input type="text" class="form-control" id="email" name="email"
                            placeholder="Введите email" autofocus="">
                    </div>
                    <div class="item">
                        <label for="">Пароль</label>
                        <input type="password" id="password" class="form-control" name="password"
                            placeholder="············" aria-describedby="password">
                    </div>

                    <div class="alert alert-danger item" id="loginError" style="display:none;">
                        Invalid email or password.
                    </div>

                    <div class="item forget">
                        <div class="d-flex justify-content-between">
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" name="remember" value="1">
                                <label class="form-check-label" for="rememberMe">Remember Me</label>
                            </div>
                            <a
                                href="https://demos.themeselection.com/sneat-bootstrap-html-laravel-admin-template/demo-1/auth/forgot-password-basic">
                                <span>Забыли пароль?</span>
                            </a>
                        </div>
                    </div>
                    <div class="mb-3">
                        <button class="btn btn-primary d-grid w-100" type="submit">Login</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</body>

<script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === '1') {
            const el = document.getElementById('loginError');
            if (el) el.style.display = 'block';
        }
        if (params.get('installed') === '1') {
            // optionally show a success state later
        }
    })();

    (async function () {
        try {
            const res = await fetch('/backend/auth/csrf', { credentials: 'include' });
            const data = await res.json();
            const token = data && data.csrf;
            const form = document.getElementById('loginForm');
            if (form && token) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = '_csrf';
                input.value = token;
                form.appendChild(input);
            }
        } catch (e) {
            // If CSRF can't be fetched, login will fail safely.
        }
    })();
</script>

</html>
