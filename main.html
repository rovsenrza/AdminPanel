<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - Admin Panel Data Fetch</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Public Sans', sans-serif;
            background: #f5f5f9;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
        }
        .header {
            background: linear-gradient(135deg, #696cff 0%, #5a5feb 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .card {
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .card-header {
            background: #f8f9fa;
            border-bottom: 2px solid #696cff;
            font-weight: 600;
            padding: 15px 20px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #696cff;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .category-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .category-item:last-child {
            border-bottom: none;
        }
        .news-item {
            border-bottom: 1px solid #eee;
            padding: 20px;
        }
        .news-item:last-child {
            border-bottom: none;
        }
        .news-image {
            width: 100%;
            max-width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 4px;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        .setting-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
        }
        .setting-label {
            font-weight: 600;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .setting-value {
            color: #333;
            word-break: break-word;
        }
        .pagination-info {
            background: #e7f3ff;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .social-link {
            display: inline-block;
            margin: 5px;
            padding: 5px 10px;
            background: #696cff;
            color: white;
            border-radius: 4px;
            text-decoration: none;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            color: #696cff;
        }
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-database"></i> Admin Panel API Test</h1>
            <p class="mb-0">Real-time data fetching from admin panel API</p>
        </div>

        <div id="stats" class="stats"></div>

        <div class="row">
            <!-- Settings -->
            <div class="col-md-12 mb-4">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-cog"></i> Site Settings
                    </div>
                    <div class="card-body" id="settingsContainer">
                        <div class="loading">
                            <i class="fas fa-spinner fa-spin"></i> Loading settings...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Categories -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-folder"></i> Categories
                        <span class="badge bg-primary float-end" id="categoriesCount">0</span>
                    </div>
                    <div class="card-body" id="categoriesContainer" style="max-height: 600px; overflow-y: auto;">
                        <div class="loading">
                            <i class="fas fa-spinner fa-spin"></i> Loading categories...
                        </div>
                    </div>
                </div>
            </div>

            <!-- News -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-newspaper"></i> News Articles
                        <span class="badge bg-primary float-end" id="newsCount">0</span>
                    </div>
                    <div class="card-body" id="newsContainer" style="max-height: 600px; overflow-y: auto;">
                        <div class="loading">
                            <i class="fas fa-spinner fa-spin"></i> Loading news...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        // NOTE: The remote server at adminpanel.81.whm.az may block browser requests due to CORS.
        // If testing locally, ensure your local backend is running and update baseUrl (e.g., 'http://localhost/backend').
        const API_CONFIG = {
            baseUrl: 'https://adminpanel.81.whm.az/backend',
            publicKey: '0cf91480ab608f6562ddc5d4494d2f17bc1b4d3b71269539e538aafa71e134e5',
            privateKey: 'd20c27653ca08f5a99d5e15a020634e09467a730fe345e2e4a82e682da427cd9'
        };

        // Fetch function with error handling
        async function fetchAPI(endpoint) {
            try {
                const url = `${API_CONFIG.baseUrl}${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${API_CONFIG.publicKey}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                return { success: true, data };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        // Load Settings
        async function loadSettings() {
            const container = document.getElementById('settingsContainer');
            const result = await fetchAPI('/public/settings');
            
            if (!result.success) {
                container.innerHTML = `<div class="error">Error loading settings: ${result.error}</div>`;
                return;
            }
            
            const settings = result.data.settings;
            
            if (!settings) {
                container.innerHTML = '<div class="text-muted">No settings found</div>';
                return;
            }
            
            let html = '<div class="settings-grid">';
            
            // Site Title
            if (settings.site_title) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">Site Title</div>
                        <div class="setting-value">${escapeHtml(settings.site_title)}</div>
                    </div>
                `;
            }
            
            // Domain
            if (settings.domain) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">Domain</div>
                        <div class="setting-value">${escapeHtml(settings.domain)}</div>
                    </div>
                `;
            }
            
            // Language
            if (settings.language) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">Language</div>
                        <div class="setting-value">${escapeHtml(settings.language)}</div>
                    </div>
                `;
            }
            
            // SEO Default Title
            if (settings.seo_default_title) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">SEO Default Title</div>
                        <div class="setting-value">${escapeHtml(settings.seo_default_title)}</div>
                    </div>
                `;
            }
            
            // SEO Default Description
            if (settings.seo_default_description) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">SEO Default Description</div>
                        <div class="setting-value">${escapeHtml(settings.seo_default_description)}</div>
                    </div>
                `;
            }
            
            // SEO Default Keywords
            if (settings.seo_default_keywords) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">SEO Default Keywords</div>
                        <div class="setting-value">${escapeHtml(settings.seo_default_keywords)}</div>
                    </div>
                `;
            }
            
            // Social Links
            if (settings.social_links && typeof settings.social_links === 'object') {
                let socialHtml = '';
                for (const [key, value] of Object.entries(settings.social_links)) {
                    if (value) {
                        socialHtml += `<a href="${escapeHtml(value)}" target="_blank" class="social-link">
                            <i class="fab fa-${key}"></i> ${key.charAt(0).toUpperCase() + key.slice(1)}
                        </a>`;
                    }
                }
                if (socialHtml) {
                    html += `
                        <div class="setting-item" style="grid-column: 1 / -1;">
                            <div class="setting-label">Social Links</div>
                            <div class="setting-value">${socialHtml}</div>
                        </div>
                    `;
                }
            }

            // Logo Path
            if (settings.logo_path) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">Logo Path</div>
                        <div class="setting-value">${escapeHtml(settings.logo_path)}</div>
                    </div>
                `;
            }

            // Telegram Link
            if (settings.telegram_link) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">Telegram Link</div>
                        <div class="setting-value"><a href="${escapeHtml(settings.telegram_link)}" target="_blank">${escapeHtml(settings.telegram_link)}</a></div>
                    </div>
                `;
            }

            // WhatsApp Number
            if (settings.whatsapp_number) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">WhatsApp Number</div>
                        <div class="setting-value">${escapeHtml(settings.whatsapp_number)}</div>
                    </div>
                `;
            }

            // GA ID
            if (settings.ga_id) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">Google Analytics ID</div>
                        <div class="setting-value">${escapeHtml(settings.ga_id)}</div>
                    </div>
                `;
            }

            // GSC Verification
            if (settings.gsc_verification) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">GSC Verification</div>
                        <div class="setting-value">${escapeHtml(settings.gsc_verification)}</div>
                    </div>
                `;
            }

            // API Key (Masked)
            if (settings.api_key) {
                html += `
                    <div class="setting-item">
                        <div class="setting-label">API Key</div>
                        <div class="setting-value"><code>${escapeHtml(settings.api_key.substring(0, 10) + '...')}</code></div>
                    </div>
                `;
            }
            
            html += '</div>';
            container.innerHTML = html;
        }

        // Load Categories
        async function loadCategories() {
            const container = document.getElementById('categoriesContainer');
            const result = await fetchAPI('/public/categories');
            
            if (!result.success) {
                container.innerHTML = `<div class="error">Error loading categories: ${result.error}</div>`;
                document.getElementById('categoriesCount').textContent = '0';
                return;
            }
            
            const categories = result.data.categories || [];
            document.getElementById('categoriesCount').textContent = categories.length;
            
            if (categories.length === 0) {
                container.innerHTML = '<div class="text-muted">No categories found</div>';
                return;
            }
            
            let html = '';
            categories.forEach(cat => {
                const parentInfo = cat.parent_id ? ` <small class="text-muted">(Child of ID: ${cat.parent_id})</small>` : '';
                html += `
                    <div class="category-item">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="flex-grow-1">
                                <h6 class="mb-1">${escapeHtml(cat.name)}</h6>
                                <small class="text-muted">
                                    <i class="fas fa-link"></i> ${escapeHtml(cat.slug || 'N/A')}${parentInfo}
                                </small>
                                ${cat.description ? `<p class="mb-0 mt-2 small">${escapeHtml(cat.description)}</p>` : ''}
                            </div>
                            <span class="badge bg-secondary">#${cat.id}</span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // Load News
        async function loadNews() {
            const container = document.getElementById('newsContainer');
            const result = await fetchAPI('/public/news?page=1&per_page=20');
            
            if (!result.success) {
                container.innerHTML = `<div class="error">Error loading news: ${result.error}</div>`;
                document.getElementById('newsCount').textContent = '0';
                return;
            }
            
            const news = result.data.news || [];
            const pagination = result.data.pagination || {};
            
            document.getElementById('newsCount').textContent = pagination.total || news.length;
            
            if (news.length === 0) {
                container.innerHTML = '<div class="text-muted">No news found</div>';
                return;
            }
            
            let html = '';
            if (pagination.total) {
                html += `
                    <div class="pagination-info">
                        <strong>Total:</strong> ${pagination.total} articles | 
                        <strong>Page:</strong> ${pagination.page} of ${pagination.total_pages} | 
                        <strong>Per Page:</strong> ${pagination.per_page}
                    </div>
                `;
            }
            
            news.forEach(item => {
                const imageHtml = item.image ? 
                    `<img src="https://adminpanel.81.whm.az${escapeHtml(item.image)}" class="news-image mb-2" alt="${escapeHtml(item.title)}">` : 
                    '<div class="text-muted mb-2"><i class="fas fa-image"></i> No image</div>';
                
                const categoryHtml = item.category_name ? 
                    `<span class="badge bg-primary">${escapeHtml(item.category_name)}</span>` : 
                    '<span class="badge bg-secondary">Uncategorized</span>';
                
                const date = item.created_at ? new Date(item.created_at).toLocaleDateString('az-AZ') : 'N/A';
                
                html += `
                    <div class="news-item">
                        ${imageHtml}
                        <h6 class="mt-2">${escapeHtml(item.title)}</h6>
                        <div class="mb-2">
                            ${categoryHtml}
                            <small class="text-muted ms-2"><i class="fas fa-calendar"></i> ${date}</small>
                        </div>
                        ${item.short_desc_html ? `<div class="small text-muted">${stripHtml(item.short_desc_html).substring(0, 100)}...</div>` : ''}
                        <div class="mt-2">
                            <small class="text-muted">
                                <i class="fas fa-link"></i> Slug: <code>${escapeHtml(item.slug || 'N/A')}</code>
                            </small>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // Load all data and update stats
        async function loadAllData() {
            await Promise.all([
                loadSettings(),
                loadCategories(),
                loadNews()
            ]);
            
            updateStats();
        }

        // Update statistics
        async function updateStats() {
            const statsContainer = document.getElementById('stats');
            
            // Get counts
            const categoriesResult = await fetchAPI('/public/categories');
            const newsResult = await fetchAPI('/public/news?page=1&per_page=1');
            
            const categoriesCount = categoriesResult.success ? (categoriesResult.data.categories || []).length : 0;
            const newsTotal = newsResult.success ? (newsResult.data.pagination?.total || 0) : 0;
            
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${categoriesCount}</div>
                    <div class="stat-label">Categories</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${newsTotal}</div>
                    <div class="stat-label">News Articles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${newsResult.success && newsResult.data.settings ? '✓' : '✗'}</div>
                    <div class="stat-label">API Status</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">4</div>
                    <div class="stat-label">Endpoints Tested</div>
                </div>
            `;
        }

        // Utility functions
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function stripHtml(html) {
            if (!html) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadAllData();
            
            // Auto-refresh every 30 seconds
            setInterval(loadAllData, 30000);
        });
    </script>
</body>
</html>
